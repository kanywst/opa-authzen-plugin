name: Claude review

# CI answers "does it build and do the tests pass". This asks the question no
# script here can. It reviews, it does not gate: nothing here is a required
# check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. The cost is that
# any change to this file, including the one that added it, goes unreviewed by
# Claude until it is merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per pull request. A rapid re-push cancels the run it superseded
# rather than paying for a review of a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A pull request from a fork gets no secrets, so the job would fail on
    # authentication rather than say anything useful. A run triggered by
    # Dependabot is the same problem by another route: it reads the Dependabot
    # secret store rather than the Actions one, so the token is empty there
    # regardless of the branch living in this repository. The test is on the
    # actor and not the pull request author, because a human reopening a
    # Dependabot pull request does get the secrets and is worth reviewing.
    # Drafts are skipped until they are marked ready, which is what the
    # ready_for_review trigger is for.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # Required by the action's default GitHub App authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Without the secret the action exits successfully having reviewed
      # nothing, which is worse than failing: the check goes green and the
      # pull request looks reviewed. Fail here instead, where the reason is
      # legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            This repo builds an extended OPA that serves the OpenID AuthZEN Authorization
            API 1.0 as a native plugin: POST /access/v1/evaluation, POST
            /access/v1/evaluations, and GET /.well-known/authzen-configuration, alongside
            OPA's own routes in the same process.

            Do not repeat what CI already does. The build, lint and e2e jobs run on this PR
            already.

            Look for what only a reader can catch:

            1. Drift from the AuthZEN 1.0 final text. Member names and request and response
               shapes come from the specification. This is the easiest defect to miss here,
               because both sides still parse when a name is wrong.

            2. Panics. The plugin runs inside the OPA process, so an index, type assertion
               or map access on request-controlled input takes OPA down with it.

            3. Regressions in OPA itself. The AuthZEN routes must not shadow or alter the
               built-in routes, or every existing user of the binary is affected.

            4. Fail-open. An evaluation that errors must deny, and the batch endpoint has to
               keep per-item results aligned with per-item inputs, including when one item
               fails.

            5. Dependency semantics. An OPA bump can change evaluation behaviour, so it
               deserves more scrutiny here than in an ordinary service.

            Post findings as inline comments on the lines they concern. Use one
            top-level comment for the summary. Be specific and cite
            `file:line`. If the diff is clean against all of the above, say so
            in one line rather than manufacturing nits.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
