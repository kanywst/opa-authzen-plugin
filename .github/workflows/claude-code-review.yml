name: Claude code review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

# A rapid re-push should supersede the in-flight review rather than post twice.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Advisory, not a gate. A reviewer that cannot reach the API (expired token, empty
    # credit balance, provider outage) says nothing about the change under review, so it
    # must not be what blocks a merge. Read the job log when the review is missing.
    continue-on-error: true
    # Dependabot bumps are lockfile-only, so reviewing them just burns tokens.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # Keeps the job green (and silent) until the token is added to the repo secrets,
      # instead of turning every PR red with an auth failure. A pull request from a fork
      # cannot see the secret either, so this covers that case too.
      - name: Check for a token
        id: key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=${CLAUDE_CODE_OAUTH_TOKEN:+true}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.present == 'true'
        with:
          # `claude setup-token` issues an OAuth token (sk-ant-oat01-...) that runs on the
          # Claude subscription. It is not an API key and is rejected by the x-api-key
          # header, so it has to go through this input rather than anthropic_api_key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in the working
            directory.

            This repo builds an extended OPA that serves the OpenID AuthZEN Authorization API 1.0 as a
            native plugin: POST /access/v1/evaluation, POST /access/v1/evaluations, and GET
            /.well-known/authzen-configuration, alongside OPA's own routes in the same process.

            Focus on:
            - Spec conformance against the AuthZEN 1.0 final text. Member names and the request and
              response shapes come from the specification, not from what reads nicely. Drift here is
              exactly the class of bug worth catching, and it is subtle because both sides still
              parse.
            - The plugin runs inside the OPA process, so a panic takes OPA down with it. Anything
              reaching into a map, slice or type assertion on request-controlled input needs to be
              safe on malformed input.
            - The AuthZEN routes must not shadow or alter OPA's built-in routes. A regression there
              breaks every existing user of the binary.
            - An evaluation that errors must deny rather than default to allow, and the batch
              endpoint has to keep per-item results aligned with per-item inputs.
            - Rego and OPA version coupling: an OPA bump can change evaluation semantics, so a
              dependency change deserves more scrutiny here than in an ordinary service.

            Report only what you can point at in the diff. Do not restate what the change
            does, do not praise it, and skip nits that golangci-lint would already catch. If the
            change looks sound, say so in one line rather than inventing findings.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            to point at specific lines.
            Only post GitHub comments, do not return the review as a message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
