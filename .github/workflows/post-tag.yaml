name: Post Tag

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Keyless signing exchanges this OIDC token for a short-lived Fulcio
      # certificate, so the release needs no long-lived signing key.
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # goreleaser derives the version and changelog from tag history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # goreleaser shells out to these two; neither is a Go package, so both
      # are installed here rather than tracked in go.mod.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Resolve tool versions
        id: tools
        run: echo "goreleaser=$(make -s print-goreleaser-version)" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ steps.tools.outputs.goreleaser }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
