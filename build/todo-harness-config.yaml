# Plugin config for the AuthZEN interop Todo harness (make test-harness).
#
# Deliberately decision-only. The harness compares each Access Evaluations
# response to its expected value with JSON.stringify, so the optional
# per-item `context` member (spec Section 5.5.1) that decision_context adds
# reads as a failure even when every decision is right.
plugins:
  authzen:
    path: "authzen"
    decision: "allow"
