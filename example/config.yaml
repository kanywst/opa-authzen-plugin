plugins:
  authzen:
    path: "authzen"
    decision: "allow"
    # Optional: enable AuthZEN Search APIs (spec Section 8). Each field names
    # a Rego rule, in the package given by `path`, that returns the set of
    # permitted entities for a partial input. Omit a field to disable the
    # corresponding endpoint (which then responds with 501).
    search:
      subject: "subject_search"
      resource: "resource_search"
      action: "action_search"
      # max_limit: 1000  # per-page cap; defaults to 1000 when unset
    # Optional: PDP capability URNs advertised in the `capabilities` field of
    # the PDP metadata document (spec Section 9.1.2). The core spec registers no
    # URNs of its own, so these are operator-supplied and must start with "urn:".
    # capabilities:
    #   - "urn:openid:authzen:capability:access-request"
    # Optional: opt into the AuthZEN Obligations Profile 1.0. The listed
    # Obligation Types are advertised as `supported_obligations` in the PDP
    # metadata, and a PEP's own `context.supported_obligations` is filtered down
    # to this set before the policy sees it. Pair with `decision_context` to
    # actually emit obligations in the Decision context.
    # supported_obligations:
    #   - "step-up"
    #   - "notification"
    # Optional: advertise the Access Request and Approval Profile 1.0 discovery
    # members in the PDP metadata. Both must be https:// URIs. This plugin does
    # not host the Access Request Service — the profile allows a separate
    # service to — so these point at wherever it actually runs. Pair with
    # `decision_context` to emit `context.access_request` on a requestable
    # denial, and list the capability URN above.
    # access_request_endpoint: "https://requests.example.com/access/v1/requests"
    # jwks_uri: "https://requests.example.com/access/v1/jwks"
