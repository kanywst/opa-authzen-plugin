apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-authzen
  labels:
    app.kubernetes.io/name: opa-authzen
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opa-authzen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opa-authzen
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opa-authzen
          image: ghcr.io/kanywst/opa-authzen-plugin
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --shutdown-wait-period=5
            - --config-file=/policy/config.yaml
            - /policy/policy.rego
          ports:
            - name: http
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: opa-authzen
